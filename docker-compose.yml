# =============================================================================
# Hermes host agent - starter
# =============================================================================

name: pressrelizagent

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pressrelizagent:0.3.0
    container_name: pressrelizagent
    restart: unless-stopped

    env_file:
      # Optional: a server can pass real env vars instead of shipping a .env
      - path: .env
        required: false

    environment:
      APP_NAME: ${APP_NAME:-PressRelizAgent}
      APP_ENV: ${APP_ENV:-production}
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /app/logs
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # LLM: one switch, two blocks — see .env.example
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1}
      HERMES_TASK_MODEL: ${HERMES_TASK_MODEL:-}
      OPENAI_TASK_MODEL: ${OPENAI_TASK_MODEL:-}
      # Local OpenAI-compatible server (Ollama / vLLM / LM Studio). The host
      # machine is reachable at host.docker.internal — see extra_hosts below.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_TASK_MODEL: ${OLLAMA_TASK_MODEL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      HERMES_TASK_ROUTING: ${HERMES_TASK_ROUTING:-true}
      HERMES_HOME: /home/appuser/.hermes
      HERMES_ENABLE_PROJECT_PLUGINS: "true"
      PYTHONPATH: /opt/hermes-agent
      # Left empty on purpose: the host derives it from LLM_PROVIDER.
      HERMES_INFERENCE_PROVIDER: ${HERMES_INFERENCE_PROVIDER:-}
      HERMES_ENABLED_TOOLSETS: ${HERMES_ENABLED_TOOLSETS:-memory,session_search,skills,todo,pressreliz}
      HERMES_SYSTEM_PROMPT_PATH: /app/prompts/hermes_coordinator.md
      HERMES_MAX_ITERATIONS: ${HERMES_MAX_ITERATIONS:-12}
      HERMES_SESSION_HISTORY_LIMIT: ${HERMES_SESSION_HISTORY_LIMIT:-6}
      HERMES_SKIP_MEMORY: ${HERMES_SKIP_MEMORY:-false}
      HERMES_REASONING_ENABLED: ${HERMES_REASONING_ENABLED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      HEALTHCHECK_URL: http://127.0.0.1:8080/health
      # Neo4j — reached over the compose network, so the container port (7687)
      # is what matters here, not the published one.
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-pressreliz-neo4j}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}

    # service_started, not service_healthy: the API's own readiness does not
    # depend on the graph, and waiting for Neo4j would serialize ~60s onto
    # every app start. A graph tool must handle "not up yet" on its own.
    depends_on:
      neo4j:
        condition: service_started

    ports:
      # host:container — APP_PORT is the in-container bind port (always
      # 8080); HOST_PORT is what the outside world connects to.
      # Not 7000: Windows/WinNAT reserves 6945-7044 on this host, and a port
      # inside a reserved range fails to bind with "socket access forbidden".
      # Check with: netsh interface ipv4 show excludedportrange protocol=tcp
      - "${HOST_PORT:-7100}:8080"

    # Reach an Ollama / vLLM / LM Studio server running on the host machine.
    # Docker Desktop provides this name already; Linux needs it spelled out.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # Hermes writes memory, skills, session history and cache under
      # HERMES_HOME. A named volume keeps them across redeploys.
      - hermes_home:/home/appuser/.hermes:rw
      - ./logs:/app/logs:rw
      - ./data:/app/data:rw
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
      # Bind-mounted so a tool edit needs a restart, not a rebuild.
      # start.sh copies each plugin into $HERMES_HOME/plugins on boot.
      - ./plugins:/app/plugins:ro

    healthcheck:
      test: ["CMD", "/app/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    security_opt:
      - no-new-privileges:true

  # ===========================================================================
  # Neo4j — knowledge graph store for the press-release agent
  # ===========================================================================
  neo4j:
    # Edition AND version are a single switch, and the kgdb dump pins both:
    #   * it is stored in `block` format, which Community cannot open at all
    #     -- that format is Enterprise-only;
    #   * it was produced by a server newer than 5.26, and neo4j-admin refuses
    #     a downgrade load outright ("newer version than the current
    #     binaries"), so the version has to move forward too.
    # Enterprise is free for development and testing; production use needs a
    # commercial licence. Going back to NEO4J_IMAGE=neo4j:5.26-community is
    # only possible once the graph is re-exported in `aligned` format.
    image: ${NEO4J_IMAGE:-neo4j:2026.07-enterprise}
    container_name: pressrelizagent-neo4j
    restart: unless-stopped

    environment:
      # Ignored by the community image; required by the enterprise one.
      NEO4J_ACCEPT_LICENSE_AGREEMENT: ${NEO4J_ACCEPT_LICENSE_AGREEMENT:-yes}
      # One source of truth: NEO4J_AUTH is assembled from the same user and
      # password the app is handed above, so the two can never drift apart.
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-pressreliz-neo4j}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_default__listen__address: 0.0.0.0
      NEO4J_server_http_listen__address: 0.0.0.0:7474
      NEO4J_server_bolt_listen__address: 0.0.0.0:7687
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
      # apoc.import/export read and write under /var/lib/neo4j/import, which is
      # bind-mounted from ./data/neo4j/import below.
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_export_file_enabled: "true"
      # Conservative defaults — this machine also runs Ollama with a 27B model.
      # Raise them in .env once the real graph is loaded.
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}

    ports:
      # 7474/7475 and 7687 are already taken on this host by other projects.
      - "${NEO4J_HTTP_PORT:-7476}:7474"
      - "${NEO4J_BOLT_PORT:-7688}:7687"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      # Bind mounts, not named volumes: a .dump or CSV is dropped in from the
      # host, so the folder has to be reachable from Windows.
      - ./data/neo4j/import:/var/lib/neo4j/import:rw
      - ./data/neo4j/dumps:/dumps:rw

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 || exit 1"]
      interval: 20s
      timeout: 10s
      start_period: 60s
      retries: 10

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  hermes_home:
    name: pressrelizagent-hermes-home
  neo4j_data:
    name: pressrelizagent-neo4j-data
  neo4j_logs:
    name: pressrelizagent-neo4j-logs
  neo4j_plugins:
    name: pressrelizagent-neo4j-plugins

networks:
  default:
    name: pressrelizagent-net
