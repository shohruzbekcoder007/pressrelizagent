# Hermes profile for the host agent (starter)
_config_version: 21

model:
  default: ""

agent:
  max_iterations: 12

plugins:
  # Standalone plugins are opt-in: a plugin present in
  # $HERMES_HOME/plugins but missing here is silently skipped.
  enabled:
    - pressreliz
    - pdfmd
    - telegram
  disabled: []

tools:
  cli:
    enabled: []
    disabled:
      - terminal
      - browser
      - web
      - code_execution
      - delegation

memory:
  provider: ""

security:
  allow_dangerous_tools: false

gateway:
  enabled: false

logging:
  level: INFO
